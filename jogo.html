<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
    >
    <title>Quebra-cabeça da Lara</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="app-shell" class="app-shell">
      <header class="topbar" aria-label="Navegação e progresso">
        <a class="back-link" href="index.html" aria-label="Voltar para a apresentação do presente">
          <span aria-hidden="true">&#8592;</span> Voltar
        </a>

        <div class="header-controls" aria-label="Controles do quebra-cabeça">
          <div class="header-select">
            <label class="sr-only" for="difficulty">Dificuldade</label>
            <span class="mini-puzzle" aria-hidden="true">&#10070;</span>
            <select id="difficulty" aria-label="Dificuldade do quebra-cabeça">
              <option value="50" selected>50 peças</option>
              <option value="100">100 peças</option>
              <option value="150">150 peças</option>
              <option value="200">200 peças</option>
            </select>
          </div>
          <button id="shuffle" class="header-button header-button-primary" type="button" aria-label="Embaralhar peças">
            <span aria-hidden="true">&#8644;</span><span class="button-label">Embaralhar</span>
          </button>
          <button id="undo" class="header-button" type="button" aria-label="Desfazer movimento" disabled>
            <span aria-hidden="true">&#8630;</span><span class="button-label">Desfazer</span>
          </button>
          <button id="hint" class="header-button" type="button" aria-label="Mostrar foto completa">
            <span aria-hidden="true">&#8857;</span><span class="button-label">Ver foto</span>
          </button>
          <button id="fullscreen" class="header-button header-icon-button" type="button" aria-label="Ativar tela cheia" title="Ativar tela cheia">
            <span aria-hidden="true">&#9974;</span>
          </button>
        </div>

        <div class="stats" aria-label="Progresso do jogo">
          <div class="stat-card">
            <span class="puzzle-icon" aria-hidden="true">&#10070;</span>
            <span><strong id="moves">0</strong><small>movimentos</small></span>
          </div>
          <div class="stat-card">
            <span class="clock-icon" aria-hidden="true"></span>
            <span><strong id="progress">0%</strong><small>concluído</small></span>
          </div>
        </div>
      </header>

      <section class="game-layout">
        <section class="board-card" aria-label="Área do quebra-cabeça">
          <div class="board-frame">
            <div id="board" class="board" role="group" aria-label="Quebra-cabeça">
              <div class="photo-guide" aria-hidden="true"></div>
            </div>
            <div id="piece-feedback" class="piece-feedback" role="status" aria-live="polite" hidden>
              Peça encaixada!
            </div>
            <div id="celebration" class="celebration" aria-hidden="true"></div>
            <div id="complete-message" class="complete-message" role="status" aria-live="polite" hidden>
              <h2>Feliz Dia dos Pais!</h2>
              <p>Papai, eu te amo muito. Com carinho, Lara.</p>
            </div>
          </div>
        </section>
        <p id="game-status" class="game-status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
